<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>İkiz Villa · Sanal Tur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
  :root{--bg:#0b0c0f;--fg:#f0ede6;--muted:rgba(240,237,230,.58);--gold:#c9a96e;--line:rgba(240,237,230,.14);
        --serif:"Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
  html,body{height:100%;margin:0} body{background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:var(--sans)}
  #unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);outline:none}
  #loader{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
          padding:0 max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 40%,#1a1c22 0%,var(--bg) 70%);transition:opacity .9s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .mark{width:54px;height:54px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:22px;margin-bottom:26px}
  .title{font-family:var(--serif);font-size:clamp(36px,7vw,68px);letter-spacing:.03em}
  .sub{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-top:12px}
  .bar{width:min(340px,72vw);height:1px;background:var(--line);margin-top:42px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}
  .pct{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:14px;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted);margin-top:22px;max-width:46ch;line-height:1.55}
  .back{position:fixed;z-index:6;top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  .back:hover{color:var(--fg)}
  #warn{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));font-size:13px;line-height:1.5;
        background:rgba(12,13,16,.92);border:1px solid var(--line);padding:12px 16px;border-radius:6px;z-index:7}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){#loader,.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <a class="back" href="../" id="back">← İkiz Villa</a>
  <div class="mark">İV</div>
  <div class="title" id="t">İkiz Villa</div>
  <div class="sub" id="s">HTS Solar Enerji · Sanal Tur</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pct" id="pct">0%</div>
  <div class="note" id="n">Etkileşimli 3D tur yükleniyor. İlk açılış bağlantıya göre biraz sürebilir; sonraki açılışlar çok daha hızlıdır. En iyi deneyim için masaüstü bilgisayarda güncel Chrome, Edge, Firefox veya Safari önerilir.</div>
</div>
<div id="warn" hidden></div>
<script>
(function () {
  var EN = /[?&]lang=en/.test(location.search) || location.hash === '#en';
  if (EN) {
    document.documentElement.lang = 'en';
    document.getElementById('t').textContent = 'Twin Villa';
    document.getElementById('s').textContent = 'HTS Solar Enerji · Virtual Tour';
    document.getElementById('n').textContent = 'Loading the interactive 3D tour. The first visit can take a little while; later visits are much faster. For the best experience use a current Chrome, Edge, Firefox or Safari on a desktop computer.';
    document.getElementById('back').textContent = '← Twin Villa';
    document.title = 'Twin Villa · Virtual Tour';
  }
  var bar = document.getElementById('bar'), pct = document.getElementById('pct'), warn = document.getElementById('warn');
  function fail(m) { warn.textContent = m; warn.hidden = false; }
  function setP(p) { var v = Math.max(0, Math.min(100, Math.round(p * 100))); bar.style.width = v + '%'; pct.textContent = v + '%'; }

  // The Unity data file is split into parts below GitHub's file-size limit; they are joined here in the browser.
  // Parts are kept in the browser's Cache Storage, so later visits load from disk instead of the network.
  var M = null, total = 1, got = 0, CACHE = 'ikiz-villa-tour';
  function lowEndGpu() {
    try { var gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
      var e = gl.getExtension('WEBGL_debug_renderer_info'); var r = (e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : '') + '';
      return /intel|uhd|iris|mali|adreno|powervr|apple|swiftshader|llvmpipe|basic render/i.test(r); } catch (x) { return false; }
  }
  function getPart(u, cache) {
    var url = u + '?v=' + M.version;
    var net = function () { return fetch(url).then(function (r) { if (!r.ok) throw new Error(u + ' ' + r.status); if (cache) cache.put(url, r.clone()).catch(function () {}); return r; }); };
    if (!cache) return net();
    return cache.match(url).then(function (hit) { return hit || net(); }).catch(net);
  }
  function fetchParts(list, cache) {
    return Promise.all(list.map(function (u) {
      return getPart(u, cache).then(function (r) {
        var rd = r.body.getReader(), ch = [];
        function pump() { return rd.read().then(function (x) { if (x.done) return new Blob(ch); ch.push(x.value); got += x.value.length; setP(got / total * 0.92); return pump(); }); }
        return pump();
      });
    })).then(function (b) { return new Blob(b); });
  }
  function gunzip(blob) {
    if (!('DecompressionStream' in window)) throw new Error('nodecomp');
    return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
    fetch('parts/manifest.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
    M = m; total = m.dataSize + m.codeSize;
    if (!('caches' in window)) return null;
    var name = CACHE + '-' + m.version;
    return caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf(CACHE) === 0 && k !== name; }).map(function (k) { return caches.delete(k); })); })
      .then(function () { return caches.open(name); }).catch(function () { return null; });
  }).then(function (cache) {
    var DATA = M.data.map(function (f) { return 'parts/' + f; }), CODE = M.code.map(function (f) { return 'parts/' + f; });
    return Promise.all([fetchParts(DATA, cache).then(gunzip), fetchParts(CODE, cache).then(gunzip)]);
  }).then(function (res) {
    var dataBuf = res[0], codeBuf = res[1], realFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var u = typeof input === 'string' ? input : (input && input.url) || '';
      if (/villa\.data$/.test(u)) return Promise.resolve(new Response(dataBuf, { headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(dataBuf.byteLength) } }));
      if (/villa\.wasm$/.test(u)) return Promise.resolve(new Response(codeBuf, { headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(codeBuf.byteLength) } }));
      return realFetch(input, init);
    };
    var s = document.createElement('script');
    s.src = 'Build/loader.js?v=' + M.version;
    s.onload = function () {
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      createUnityInstance(document.getElementById('unity-canvas'), {
        dataUrl: 'villa.data', frameworkUrl: 'Build/framework.js?v=' + M.version, codeUrl: 'villa.wasm', streamingAssetsUrl: 'StreamingAssets',
        devicePixelRatio: lowEndGpu() ? 1 : Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.75),
        showBanner: function (m, t) { if (t === 'error') fail(m); }
      }, function (p) { setP(0.92 + p * 0.08); }).then(function (inst) {
        window.villaTour = inst; setP(1);
        setTimeout(function () { document.getElementById('loader').classList.add('hide'); }, 500);
      }).catch(function (m) { fail(String(m)); });
    };
    s.onerror = function () { fail(EN ? 'The tour engine could not be loaded. Please refresh the page.' : 'Tur motoru yüklenemedi. Lütfen sayfayı yenileyin.'); };
    document.body.appendChild(s);
  }).catch(function (e) {
    fail(String(e && e.message) === 'nodecomp'
      ? (EN ? 'This browser is too old for the 3D tour. Please use a current Chrome, Edge, Firefox or Safari.' : 'Bu tarayıcı 3D tur için çok eski. Lütfen güncel Chrome, Edge, Firefox veya Safari kullanın.')
      : (EN ? 'The tour files could not be downloaded. Check your connection and refresh the page.' : 'Tur dosyaları indirilemedi. Bağlantınızı kontrol edip sayfayı yenileyin.'));
  });
})();
</script>
</body>
</html>
